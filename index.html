<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rô ♥ Lê | Doces</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b1f0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rô ♥ Lê | Doces">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
    :root {
        --chocolate: #3b1f0a;
        --chocolate-mid: #6b3a1f;
        --caramelo: #c4832a;
        --caramelo-light: #e8a84e;
        --ouro: #d4a520;
        --creme: #fdf3e7;
        --creme-dark: #f5e4cc;
        --branco: #ffffff;
        --texto: #2c1506;
        --texto-soft: #7a5c3e;
        --verde-whats: #25d366;
        --vermelho: #c0392b;
        --sombra: rgba(59, 31, 10, 0.18);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Lato', sans-serif;
        background: var(--chocolate);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse at 20% 20%, rgba(196, 131, 42, 0.12) 0%, transparent 55%),
            radial-gradient(ellipse at 80% 80%, rgba(212, 165, 32, 0.08) 0%, transparent 55%),
            repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(255,255,255,0.012) 20px,
                rgba(255,255,255,0.012) 21px
            );
        pointer-events: none;
        z-index: 0;
    }

    /* ── TOAST ── */
    #toast-aviso {
        display: none;
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--chocolate);
        color: var(--caramelo-light);
        border: 1px solid var(--caramelo);
        padding: 12px 20px;
        border-radius: 18px;
        font-weight: 700;
        font-size: 0.88em;
        z-index: 11000;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        animation: slideInToast 0.3s ease-out;
        white-space: normal;
        text-align: center;
        width: 84%;
        max-width: 340px;
        letter-spacing: 0.3px;
        line-height: 1.4;
    }
    @keyframes slideInToast {
        from { top: -60px; opacity: 0; }
        to   { top: 20px;  opacity: 1; }
    }

    #toast-central {
        display: none;
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: var(--creme);
        color: var(--chocolate);
        padding: 35px 30px;
        border-radius: 24px;
        text-align: center;
        z-index: 11001;
        border: 2px solid var(--caramelo);
        box-shadow: 0 0 60px rgba(196, 131, 42, 0.5);
        width: 82%;
        max-width: 310px;
    }
    #toast-central h2 {
        font-family: 'Playfair Display', serif;
        color: var(--chocolate);
        margin: 0 0 8px;
        font-size: 1.5em;
    }
    #toast-central p { margin: 6px 0; color: var(--texto-soft); font-size: 0.88em; }

    /* ── CHUVA DE DOCES ── */
    #overlay-chuva {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10004;
        cursor: pointer;
    }
    .doce-animado {
        position: fixed;
        top: -120px;
        z-index: 10005;
        pointer-events: none;
        animation: quedaDoce linear forwards;
    }
    @keyframes quedaDoce {
        0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(115vh) rotate(720deg); opacity: 0.6; }
    }

    /* ── CARD PRINCIPAL ── */
    .main-card {
        position: relative;
        z-index: 1;
        background: var(--creme);
        border-radius: 28px;
        padding: 28px 22px;
        width: 92%;
        max-width: 460px;
        margin: 28px auto;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(196,131,42,0.2);
    }

    /* ── LOGO ── */
    .logo-area {
        text-align: center;
        margin-bottom: 28px;
    }
    .logo-area img {
        display: block;
        margin: 0 auto 8px;
        width: 260px;
        height: auto;
        border-radius: 0;
        object-fit: contain;
    }

    /* ── ABAS ── */
    .tabs {
        display: flex;
        border-bottom: 1.5px solid var(--creme-dark);
        margin-bottom: 22px;
        gap: 0;
    }
    .tab-btn {
        flex: 1;
        padding: 10px;
        border: none;
        background: none;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
        font-size: 0.88em;
        cursor: pointer;
        color: #bba990;
        border-bottom: 2px solid transparent;
        transition: all 0.25s;
        letter-spacing: 0.4px;
    }
    .tab-btn.ativa {
        color: var(--caramelo);
        border-bottom-color: var(--caramelo);
    }

    /* ── INPUTS ── */
    input, select {
        width: 100%;
        padding: 13px 15px;
        margin: 7px 0;
        border-radius: 12px;
        border: 1.5px solid var(--creme-dark);
        background: rgba(255,255,255,0.7);
        outline: none;
        box-sizing: border-box;
        font-family: 'Lato', sans-serif;
        font-size: 0.93em;
        color: var(--texto);
        transition: border-color 0.2s;
    }
    input:focus, select:focus {
        border-color: var(--caramelo);
        background: white;
    }
    input::placeholder { color: #c0a890; }

    /* ── BOTÕES ── */
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
        font-size: 0.95em;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.2s;
        letter-spacing: 0.3px;
    }
    .btn-principal {
        background: linear-gradient(135deg, var(--caramelo) 0%, var(--chocolate-mid) 100%);
        color: white;
        box-shadow: 0 4px 14px rgba(196,131,42,0.4);
    }
    .btn-principal:active { transform: scale(0.97); }
    .btn-whatsapp {
        background: var(--verde-whats);
        color: white;
        font-size: 1em;
        margin-top: 18px;
        box-shadow: 0 4px 14px rgba(37,211,102,0.3);
    }

    /* ── SAUDAÇÃO ── */
    #boas-vindas {
        font-family: 'Playfair Display', serif;
        color: var(--chocolate);
        text-align: center;
        font-size: 1.25em;
        margin-bottom: 18px;
        font-weight: 600;
    }
    #boas-vindas em {
        font-style: italic;
        color: var(--caramelo);
    }

    /* ── CATEGORIAS ── */
    .categorias-scroll {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 14px;
    }
    .cat-btn {
        padding: 8px 14px;
        border-radius: 20px;
        border: 1.5px solid var(--creme-dark);
        background: white;
        color: var(--texto-soft);
        font-family: 'Lato', sans-serif;
        font-size: 0.78em;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.3px;
        text-align: center;
    }
    .cat-btn.ativa, .cat-btn:active {
        background: var(--chocolate);
        color: var(--caramelo-light);
        border-color: var(--chocolate);
    }

    /* ── GRID DE PRODUTOS ── */
    #lista-produtos {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 2px;
    }
    .produto {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 4px 15px var(--sombra);
        aspect-ratio: 1 / 1.15;
        cursor: pointer;
        transition: transform 0.2s;
        background: var(--creme-dark);
    }
    .produto:active { transform: scale(0.97); }
    .img-produto {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .produto-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top, rgba(59,31,10,0.95) 0%, rgba(59,31,10,0.55) 60%, transparent 100%);
        padding: 10px 10px 8px;
        color: white;
    }
    .produto-overlay strong {
        display: block;
        font-size: 0.80em;
        line-height: 1.2;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
    }
    .produto-overlay .preco {
        font-size: 0.88em;
        font-weight: 700;
        color: var(--caramelo-light);
    }
    .btn-add {
        position: absolute;
        top: auto; bottom: 52px; right: 8px;
        background: var(--caramelo);
        color: white;
        border: none;
        border-radius: 50%;
        width: 32px; height: 32px;
        font-size: 1.2em;
        line-height: 1;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.15s;
    }
    .btn-add:active { transform: scale(0.9); }
    .btn-add:disabled { background: #ccc; color: #999; cursor: not-allowed; font-size: 0.65em; }

    .categoria-tag {
        position: absolute;
        top: 8px; left: 8px;
        background: rgba(59,31,10,0.75);
        color: var(--caramelo-light);
        font-size: 0.6em;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 10px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .faixa-sem-estoque {
        position: absolute;
        top: 18px; left: -30px;
        width: 120px;
        background: rgba(192,57,43,0.9);
        color: white;
        font-size: 0.6em;
        font-weight: 800;
        text-align: center;
        padding: 5px 0;
        transform: rotate(-35deg);
        pointer-events: none;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        z-index: 2;
        text-transform: uppercase;
    }

    /* ── CARRINHO ── */
    .carrinho-wrap {
        margin-top: 22px;
        background: var(--chocolate);
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(196,131,42,0.2);
    }
    .carrinho-titulo {
        font-family: 'Playfair Display', serif;
        color: var(--caramelo-light);
        font-size: 1.05em;
        margin: 0 0 12px;
        font-weight: 600;
    }
    .item-carrinho {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.88em;
        margin-bottom: 8px;
        color: var(--creme);
        border-left: 3px solid var(--caramelo);
        padding-left: 9px;
    }
    .item-carrinho button {
        background: none; border: none;
        color: var(--vermelho); cursor: pointer; font-size: 1em;
        padding: 0 4px;
    }
    .total-linha {
        display: flex;
        justify-content: space-between;
        color: var(--creme-dark);
        font-weight: 700;
        font-size: 0.95em;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(196,131,42,0.2);
    }
    .total-linha span { color: var(--caramelo-light); }

    select {
        background: rgba(255,255,255,0.08);
        color: var(--creme);
        border-color: rgba(196,131,42,0.3);
        margin-top: 10px;
    }
    select option { background: var(--chocolate-mid); color: var(--creme); }

    /* ── PEDIDOS ── */
    .secao-titulo {
        font-family: 'Playfair Display', serif;
        color: var(--chocolate);
        font-size: 1.1em;
        margin: 26px 0 12px;
        font-weight: 600;
    }
    .pedido-mini-card {
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(5px);
        padding: 12px 14px;
        border-radius: 14px;
        margin-bottom: 12px;
        border: 1px solid rgba(196,131,42,0.15);
        box-shadow: 0 2px 8px var(--sombra);
    }
    .pedido-mini-card strong { font-size: 0.88em; }
    .pedido-mini-card .itens-ped { font-size: 0.78em; color: var(--texto-soft); margin: 5px 0; line-height: 1.5; }
    .pedido-mini-card .total-ped { font-size: 0.85em; font-weight: 700; color: var(--chocolate); }

    /* ── BOTÃO FLUTUANTE ── */
    #btn-carrinho-flutuante {
        display: none;
        position: fixed;
        bottom: 22px; right: 18px;
        background: linear-gradient(135deg, var(--caramelo) 0%, var(--chocolate-mid) 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 13px 20px;
        font-family: 'Lato', sans-serif;
        font-size: 0.92em;
        font-weight: 700;
        cursor: pointer;
        z-index: 8000;
        box-shadow: 0 6px 22px rgba(59,31,10,0.5);
        align-items: center;
        gap: 8px;
        transition: transform 0.2s;
    }
    #btn-carrinho-flutuante:active { transform: scale(0.95); }
    #badge-carrinho {
        background: var(--creme);
        color: var(--chocolate);
        border-radius: 50%;
        width: 22px; height: 22px;
        font-size: 0.75em;
        display: inline-flex;
        align-items: center; justify-content: center;
        font-weight: 800;
        animation: popBadge 0.3s ease;
    }
    @keyframes popBadge {
        0%   { transform: scale(0.5); }
        70%  { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    /* ── MODAL PIX ── */
    #modal-pix {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(8px);
    }
    .pix-card {
        background: var(--creme);
        padding: 30px 24px;
        border-radius: 24px;
        text-align: center;
        width: 84%;
        max-width: 320px;
        border: 2px solid var(--caramelo);
        box-shadow: 0 0 50px rgba(196,131,42,0.4);
    }
    .pix-card h3 {
        font-family: 'Playfair Display', serif;
        color: var(--chocolate);
        margin: 0 0 14px;
    }

    /* ── DIVIDER ── */
    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 16px;
        color: #c0a890;
        font-size: 0.75em;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--creme-dark);
    }

    /* ── LINK ESQUECI SENHA ── */
    .link-senha {
        text-align: center;
        margin-top: 12px;
        display: block;
        color: var(--caramelo);
        font-size: 0.83em;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
    }

    /* ── SAIR ── */
    .btn-sair {
        background: none;
        color: #bba990;
        font-size: 0.8em;
        text-decoration: underline;
        box-shadow: none;
        margin-top: 16px;
        border: none;
        width: 100%;
        cursor: pointer;
        font-family: 'Lato', sans-serif;
        padding: 8px;
    }

    /* ── VAZIO ── */
    .vazio { color: #c0a890; font-size: 0.88em; padding: 6px 0; }
</style>
</head>
<body>

    <div id="toast-aviso"></div>
    <div id="toast-central">
        <h2>🍫 Oba!</h2>
        <p>Pedido enviado com sucesso!</p>
        <p style="font-size:0.78em; color:#bba990;">(Toque na tela para continuar)</p>
    </div>
    <div id="overlay-chuva" onclick="pararCelebracao()"></div>

    <!-- TELA DE LOGIN -->
    <div id="sessao-auth" class="main-card">
        <div class="logo-area">
            <img src="logo.png" alt="Rô ♥ Lê | Doces">
        </div>

        <div class="tabs">
            <button class="tab-btn ativa" id="tab-login" onclick="mudarAba('login')">Entrar</button>
            <button class="tab-btn" id="tab-cadastro" onclick="mudarAba('cadastro')">Cadastrar</button>
        </div>

        <div id="form-login">
            <input type="email" id="loginEmail" placeholder="Seu e-mail">
            <input type="password" id="loginSenha" placeholder="Sua senha">
            <button class="btn btn-principal" onclick="btnLogin()">☕ Entrar no Cardápio</button>
            <a class="link-senha" onclick="recuperarSenha()">Esqueci minha senha</a>
        </div>

        <div id="form-cadastro" style="display:none;">
            <div class="divider">Crie sua conta</div>
            <input type="text" id="regNome" placeholder="Seu nome / apelido">
            <input type="email" id="regEmail" placeholder="E-mail">
            <input type="password" id="regSenha" placeholder="Senha (mín. 6 dígitos)">
            <input type="tel" id="regWhatsApp" placeholder="WhatsApp (ex: 11987654321)">
            <button class="btn btn-principal" onclick="btnCadastrar()">Criar Conta 🍬</button>
        </div>
    </div>

    <!-- CARDÁPIO -->
    <div id="sessao-cardapio" class="main-card" style="display:none;">
        <div class="logo-area" style="margin-bottom:0;">
            <img src="logo.png" alt="Rô ♥ Lê | Doces">
        </div>

        <p id="boas-vindas" style="margin-top:16px;"></p>

        <!-- Filtro por categoria -->
        <div class="categorias-scroll" id="categorias-wrap">
            <button class="cat-btn ativa" onclick="filtrarCategoria('todos', this)">Todos</button>
            <button class="cat-btn" onclick="filtrarCategoria('Gelinho Gourmet', this)">🧊 Gelinhos</button>
            <button class="cat-btn" onclick="filtrarCategoria('Trufa', this)">🍫 Trufas</button>
            <button class="cat-btn" onclick="filtrarCategoria('Pão de Mel', this)">🍯 Pão de Mel</button>
        </div>

        <div id="lista-produtos">Carregando delícias...</div>

        <!-- Carrinho -->
        <div class="carrinho-wrap">
            <p class="carrinho-titulo">🛒 Carrinho</p>
            <div id="carrinho-itens"><span class="vazio">Vazio.</span></div>
            <div class="total-linha">
                <span style="color:var(--creme-dark);">Total</span>
                <span>R$ <span id="total-valor">0,00</span></span>
            </div>
            <select id="forma-pagamento" style="width:100%; margin-top:12px;">
                <option value="" disabled selected>Forma de pagamento?</option>
                <option value="Pix">Pix ⚡</option>
                <option value="Dinheiro">Dinheiro 💵</option>
                <option value="Quinzena">Na Quinzena 🗓️</option>
            </select>
            <button class="btn btn-whatsapp" onclick="enviarPedido()">Finalizar Pedido no WhatsApp 🚀</button>
        </div>

        <p class="secao-titulo">📋 Meus Pedidos</p>
        <div id="lista-meus-pedidos"></div>

        <button class="btn-sair" onclick="logout()">Sair da conta</button>
    </div>

    <!-- Botão flutuante do carrinho -->
    <button id="btn-carrinho-flutuante" onclick="rolarParaCarrinho()">
        🛒 Carrinho <span id="badge-carrinho">0</span>
    </button>

    <!-- Modal Pix -->
    <div id="modal-pix">
        <div class="pix-card">
            <h3>Pagamento via Pix ⚡</h3>
            <div id="qrcode-area"></div>
            <p style="color:var(--texto-soft); font-size:0.88em;">Total: <strong style="color:var(--chocolate);">R$ <span id="pix-valor-total">0,00</span></strong></p>
            <button class="btn btn-principal" onclick="fecharPix()">✅ Já paguei / Continuar</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, setPersistence, browserSessionPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, doc, onSnapshot, runTransaction, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const WHATSAPP_NUM = "5511973019207";
    const firebaseConfig = {
        apiKey: "AIzaSyAZtYo4CuXLzTOGsg2jRtDvbuK_t8ie33c",
        authDomain: "pedrosodoces.firebaseapp.com",
        databaseURL: "https://pedrosodoces-default-rtdb.firebaseio.com",
        projectId: "pedrosodoces",
        storageBucket: "pedrosodoces.firebasestorage.app",
        messagingSenderId: "763771198237",
        appId: "1:763771198237:web:cb3d0ec5931432fba49ff4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window._todosProdutos = [];

    async function iniciarAuth() {
        try { await setPersistence(auth, browserSessionPersistence); } catch(e) {}

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocSnap = await getDoc(doc(db, "usuarios", user.uid));
                    if (userDocSnap.exists() && userDocSnap.data().role === "admin") {
                        window.location.href = "painel.html";
                        return;
                    }
                } catch(e) {}

                document.getElementById('sessao-auth').style.display = 'none';
                document.getElementById('sessao-cardapio').style.display = 'block';
                const nome = user.displayName || "Cliente";
                document.getElementById('boas-vindas').innerHTML = `Olá, <em>${nome}</em>! ✨`;
                carregarProdutos();
                carregarMeusPedidos(user.email);
            } else {
                document.getElementById('sessao-auth').style.display = 'block';
                document.getElementById('sessao-cardapio').style.display = 'none';
            }
        });
    }
    iniciarAuth();

    window.recuperarSenha = async () => {
        const email = prompt("E-mail para recuperação:");
        if (email) {
            await sendPasswordResetEmail(auth, email)
                .then(() => alert("Link enviado! Verifique sua caixa de entrada."))
                .catch(() => alert("Erro ao enviar. Verifique o e-mail."));
        }
    };

    async function carregarProdutos() {
        const snap = await getDocs(query(collection(db, "produtos"), where("ativo", "!=", false)));
        window._todosProdutos = [];
        snap.forEach(d => window._todosProdutos.push({ id: d.id, ...d.data() }));
        renderizarProdutos(window._todosProdutos);
    }

    window.filtrarCategoria = (cat, btn) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ativa'));
        btn.classList.add('ativa');
        const lista = cat === 'todos'
            ? window._todosProdutos
            : window._todosProdutos.filter(p => (p.categoria || '') === cat);
        renderizarProdutos(lista);
    };

    function renderizarProdutos(lista) {
        const el = document.getElementById('lista-produtos');
        if (!lista.length) { el.innerHTML = '<p style="color:#c0a890; grid-column:span 2; text-align:center; padding:20px 0;">Nenhum produto nesta categoria.</p>'; return; }
        el.innerHTML = lista.map(p => `
            <div class="produto">
                <img src="${p.fotoUrl || 'placeholder.png'}" class="img-produto" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23f5e4cc%22 width=%22200%22 height=%22200%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2236%22>🍫</text></svg>'">
                <div class="produto-overlay">
                    <strong>${p.nome}</strong>
                    <span class="preco">R$ ${p.preco.toFixed(2)}</span>
                </div>
                ${p.categoria ? `<span class="categoria-tag">${p.categoria}</span>` : ''}
                ${p.estoque <= 0 ? '<div class="faixa-sem-estoque">Sem estoque</div>' : ''}
                <button class="btn-add" onclick="adicionar('${p.nome}', ${p.preco}, '${p.id}', '${p.categoria||''}')" ${p.estoque <= 0 ? 'disabled' : ''}>
                    ${p.estoque <= 0 ? '✕' : '+'}
                </button>
            </div>`).join('');
    }

    function carregarMeusPedidos(email) {
        onSnapshot(query(collection(db, "pedidos"), where("emailCliente", "==", email)), (snap) => {
            const cont = document.getElementById('lista-meus-pedidos');
            if (snap.empty) { cont.innerHTML = '<p style="color:#c0a890; font-size:0.85em;">Nenhum pedido ainda.</p>'; return; }
            cont.innerHTML = '';
            const cores = {
                "Cancelado": "#c0392b",
                "Pago": "#25d366",
                "Entregue": "#a2d2ff",
                "Pendente Pagamento (Quinzena)": "#e67e22",
                "default": "#c4832a"
            };
            snap.forEach(d => {
                const ped = d.data();
                const cor = ped.entregue ? "#a2d2ff" : (cores[ped.status] || cores.default);
                const itH = ped.itens ? Object.keys(ped.itens).map(n => `• ${ped.itens[n].qtd}x ${n}`).join('<br>') : '...';
                const quinzenaPendente = ped.pagamento === 'Quinzena' && ped.status !== 'Pago' && ped.status !== 'Cancelado';
                cont.innerHTML += `
                    <div class="pedido-mini-card" style="border-left: 5px solid ${cor};">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:6px;">
                            <strong style="font-size:0.82em;">#${ped.pedidoId}</strong>
                            <span style="color:${cor}; font-size:0.62em; font-weight:800; text-transform:uppercase; background:rgba(59,31,10,0.06); padding:3px 8px; border-radius:8px; white-space:nowrap;">${ped.entregue ? 'Entregue' : ped.status === 'Pendente Pagamento (Quinzena)' ? '💸 Quinzena' : ped.status}</span>
                        </div>
                        ${quinzenaPendente ? `<div style="font-size:0.68em; background:rgba(230,126,34,0.12); color:#e67e22; padding:3px 9px; border-radius:8px; font-weight:800; display:inline-block; margin-bottom:6px;">💸 PAGAMENTO PENDENTE (QUINZENA)</div>` : ''}
                        <div class="itens-ped">${itH}</div>
                        <div class="total-ped">Total: R$ ${ped.total.toFixed(2).replace('.',',')}</div>
                    </div>`;
            });
        });
    }

    window.enviarPedido = async () => {
        const pg = document.getElementById('forma-pagamento').value;
        if (!pg) return mostrarAviso("Escolha a forma de pagamento! ⚠️");
        if ((window._carrinhoTotal || 0) <= 0) return mostrarAviso("Carrinho vazio! 🛒");

        const u = auth.currentUser;
        if (!u) return alert("Sessão expirada. Saia e entre novamente.");

        const ts = Date.now().toString(36).toUpperCase();
        const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
        const pid = ts + rand;
        const carrinhoAtual = window._carrinho;
        const totalAtual = window._carrinhoTotal;

        try {
            await runTransaction(db, async (transaction) => {
                const prodRefs = Object.values(carrinhoAtual).map(item => doc(db, "produtos", item.idFirebase));
                const prodSnaps = await Promise.all(prodRefs.map(ref => transaction.get(ref)));
                for (let i = 0; i < prodSnaps.length; i++) {
                    const snap = prodSnaps[i];
                    const nome = Object.keys(carrinhoAtual)[i];
                    const qtdDesejada = carrinhoAtual[nome].qtd;
                    if (!snap.exists() || snap.data().estoque < qtdDesejada) throw new Error(`Estoque insuficiente para: ${nome}`);
                }
                for (let i = 0; i < prodRefs.length; i++) {
                    const nome = Object.keys(carrinhoAtual)[i];
                    transaction.update(prodRefs[i], { estoque: prodSnaps[i].data().estoque - carrinhoAtual[nome].qtd });
                }
                const { doc: docRef, collection: colRef } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                const pedidoRef = doc(collection(db, "pedidos"));
                transaction.set(pedidoRef, {
                    pedidoId: pid, cliente: u.displayName || "Cliente", emailCliente: u.email,
                    total: totalAtual, status: pg === "Quinzena" ? "Pendente Pagamento (Quinzena)" : "Pendente",
                    pagamento: pg, data: new Date().toISOString(), itens: carrinhoAtual, entregue: false
                });
            });

            let m = `*RÔ ♥ LÊ | DOCES* 🍫✨\n——————————————\n🆔 *#${pid}*\n👤 *${u.displayName}*\n——————————————\n\n*ITENS:*\n`;
            Object.keys(carrinhoAtual).forEach(n => { m += `🔹 ${carrinhoAtual[n].qtd}x ${n}\n`; });
            m += `\n💰 *TOTAL: R$ ${totalAtual.toFixed(2)}*\n💳 *PGTO:* ${pg}\n——————————————\nObrigada pela preferência! 🍯`;

            if (pg === "Pix") {
                document.getElementById('pix-valor-total').innerText = totalAtual.toFixed(2);
                document.getElementById('qrcode-area').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${WHATSAPP_NUM}" style="display:block; margin: 10px auto; border-radius: 10px;">`;
                document.getElementById('modal-pix').style.display = 'flex';
                window._msgZapTemp = m;
            } else {
                celebrarPedido();
                window.location.href = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(m)}`;
                resetar();
            }
        } catch(e) {
            if (e.message && e.message.startsWith("Estoque insuficiente")) mostrarAviso(e.message, '😢');
            else alert("Erro ao salvar o pedido. Tente novamente.");
        }
    };

    window.btnLogin = () => {
        const e = document.getElementById('loginEmail').value;
        const s = document.getElementById('loginSenha').value;
        if (!e || !s) return alert("Preencha e-mail e senha!");
        signInWithEmailAndPassword(auth, e, s).catch(() => alert("E-mail ou senha incorretos."));
    };

    window.btnCadastrar = async () => {
        const n = document.getElementById('regNome').value;
        const e = document.getElementById('regEmail').value;
        const s = document.getElementById('regSenha').value;
        const w = document.getElementById('regWhatsApp').value.replace(/\D/g,'');
        if (!n || !e) return alert("Preencha nome e e-mail!");
        if (s.length < 6) return alert("A senha precisa ter no mínimo 6 caracteres!");
        try {
            const res = await createUserWithEmailAndPassword(auth, e, s);
            await updateProfile(res.user, { displayName: n });
            const { doc: docRef, setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            await setDoc(docRef(db, "usuarios", res.user.uid), { nome: n, email: e, whatsapp: w, role: "cliente" });
        } catch(err) {
            if (err.code === 'auth/email-already-in-use') alert("Este e-mail já está em uso!");
            else alert("Erro ao criar conta.");
        }
    };

    window.logout = () => signOut(auth);

    window._carrinho = {};
    window._carrinhoTotal = 0;

    window.resetar = function() {
        window._carrinho = {};
        window._carrinhoTotal = 0;
        renderizarCarrinho();
        document.getElementById('forma-pagamento').value = "";
    };
</script>

<script>
    function mudarAba(aba) {
        const isLogin = aba === 'login';
        document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
        document.getElementById('form-cadastro').style.display = isLogin ? 'none' : 'block';
        document.getElementById('tab-login').classList.toggle('ativa', isLogin);
        document.getElementById('tab-cadastro').classList.toggle('ativa', !isLogin);
    }
    window.mudarAba = mudarAba;

    function mostrarAviso(msg) {
        const t = document.getElementById('toast-aviso');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2600);
    }
    window.mostrarAviso = mostrarAviso;

    const DOCES_CHUVA = [
        'gelinho1.png','gelinho2.png','gelinho3.png','gelinho4.png','gelinho5.png',
        'trufa1.png','trufa2.png','trufa3.png'
    ];
    function celebrarPedido() {
        document.getElementById('overlay-chuva').style.display = 'block';
        document.getElementById('toast-central').style.display = 'block';
        function lancarDoce() {
            if (document.getElementById('overlay-chuva').style.display === 'none') return;
            const d = document.createElement('img');
            const dur = Math.random() * 2 + 3;
            d.src = DOCES_CHUVA[Math.floor(Math.random() * DOCES_CHUVA.length)];
            d.className = 'doce-animado';
            d.style.left = Math.random() * 100 + 'vw';
            d.style.width = (Math.random() * 35 + 45) + 'px';
            d.style.animationDuration = dur + 's';
            document.body.appendChild(d);
            setTimeout(() => d.remove(), dur * 1000);
            setTimeout(lancarDoce, 110);
        }
        lancarDoce();
    }
    window.celebrarPedido = celebrarPedido;

    window.pararCelebracao = () => {
        document.getElementById('overlay-chuva').style.display = 'none';
        document.getElementById('toast-central').style.display = 'none';
        document.querySelectorAll('.doce-animado').forEach(el => el.remove());
    };

    window.adicionar = (nome, preco, id, categoria) => {
        if (!window._carrinho) window._carrinho = {};
        const chave = categoria ? `[${categoria}] ${nome}` : nome;
        if (window._carrinho[chave]) window._carrinho[chave].qtd++;
        else window._carrinho[chave] = { preco, qtd: 1, idFirebase: id };
        window._carrinhoTotal = (window._carrinhoTotal || 0) + preco;
        renderizarCarrinho();
        mostrarAviso(`${window._carrinho[chave].qtd}x ${nome} adicionado! 🍫`);
    };

    window.remover = (n) => {
        if (window._carrinho && window._carrinho[n]) {
            window._carrinhoTotal -= window._carrinho[n].preco;
            if (window._carrinho[n].qtd > 1) window._carrinho[n].qtd--;
            else delete window._carrinho[n];
            renderizarCarrinho();
        }
    };

    function renderizarCarrinho() {
        const carrinho = window._carrinho || {};
        const total = window._carrinhoTotal || 0;
        const c = document.getElementById('carrinho-itens');
        const k = Object.keys(carrinho);
        c.innerHTML = k.length === 0
            ? '<span class="vazio">Vazio.</span>'
            : k.map(n => `<div class="item-carrinho"><span>${carrinho[n].qtd}x ${n}</span><button onclick="remover('${n}')">✖</button></div>`).join('');
        document.getElementById('total-valor').innerText = total.toFixed(2).replace('.', ',');
        const totalItens = k.reduce((acc, n) => acc + carrinho[n].qtd, 0);
        const badge = document.getElementById('badge-carrinho');
        const btnF = document.getElementById('btn-carrinho-flutuante');
        if (badge) {
            badge.textContent = totalItens;
            badge.style.animation = 'none';
            badge.offsetHeight;
            badge.style.animation = 'popBadge 0.3s ease';
        }
        if (btnF) btnF.style.display = totalItens > 0 ? 'flex' : 'none';
    }
    window.renderizarCarrinho = renderizarCarrinho;

    window.rolarParaCarrinho = () => {
        document.querySelector('.carrinho-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.fecharPix = () => {
        document.getElementById('modal-pix').style.display = 'none';
        celebrarPedido();
        if (window._msgZapTemp) {
            const num = "5511973019207";
            window.location.href = `https://wa.me/${num}?text=${encodeURIComponent(window._msgZapTemp)}`;
            window._msgZapTemp = null;
        }
        if (window.resetar) window.resetar();
    };
</script>
</body>
</html>
